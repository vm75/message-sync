services:
  message-sync:
    container_name: message-sync
    image: message-sync:dev
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: development
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/data:Z,U
    restart: unless-stopped
    stop_grace_period: 20s
