name: Telegram MTProto branch CI

on:
  push:
    branches:
      - agent/telegram-mtproto-support

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [[ -n "$files" ]]; then
            printf 'gofmt required:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Unit and integration tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Report module drift
        if: always()
        shell: bash
        run: |
          go mod tidy
          git diff -- go.mod go.sum || true
