name: Temporary child presentation docs cleanup

on:
  push:
    branches:
      - agent/telegram-mtproto-support

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-mtproto-support
          fetch-depth: 0
      - name: Apply documentation cleanup
        run: python3 .agent/fix_feature_comparison.py
      - name: Validate diff
        run: |
          git diff --check
          if grep -F 'group:topic-or-thread/user' docs/FEATURE_COMPARISON.md; then exit 1; fi
          if grep -F 'tg1:tt1/Alice' docs/FEATURE_COMPARISON.md; then exit 1; fi
      - name: Test presentation-sensitive packages
        run: go test ./internal/router ./internal/transport/discord ./internal/transport/telegram
      - name: Commit validated docs cleanup
        env:
          BRANCH: agent/telegram-mtproto-support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_COMPARISON.md
          git commit -m "docs: align child-context presentation comparison"
          git push origin HEAD:"$BRANCH"
