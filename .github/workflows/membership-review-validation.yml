name: membership-review-validation

on:
  push:
    branches:
      - agent/membership-review-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply Go formatting
        run: |
          gofmt -w ./cmd ./internal
          if ! git diff --quiet -- ./cmd ./internal; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ./cmd ./internal
            git commit -m "gofmt membership review fixes"
            git push origin HEAD:agent/membership-review-v2
          fi
      - name: Formatting clean
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Diff checks
        run: |
          git diff --check
          git diff --exit-code origin/main...HEAD -- VERSION
