name: Apply tested agent patch

on:
  push:
    branches:
      - agent/telegram-mtproto-support
    paths:
      - .agent/patch.diff
      - .agent/commit-message.txt

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-mtproto-support
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          test -s .agent/patch.diff
          test -s .agent/commit-message.txt
          git apply --index .agent/patch.diff
          rm -f .agent/patch.diff .agent/commit-message.txt
          git add -u .agent || true
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --cached --name-only --diff-filter=ACMR -- '*.go' || true)"
          if [[ -n "$changed" ]]; then
            while IFS= read -r f; do gofmt -w "$f"; git add "$f"; done <<< "$changed"
          fi
      - name: Tidy modules
        run: |
          go mod tidy
          git add go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Commit tested patch
        shell: bash
        env:
          COMMIT_AUTHOR_NAME: vm75
          COMMIT_AUTHOR_EMAIL: vm75@users.noreply.github.com
        run: |
          set -euo pipefail
          msg="$(cat .agent/commit-message.txt 2>/dev/null || true)"
          # The message file was removed after reading by design; recover it from HEAD.
          if [[ -z "$msg" ]]; then
            msg="$(git show HEAD:.agent/commit-message.txt)"
          fi
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          git add -A
          git commit -m "$msg"
          git push origin HEAD:agent/telegram-mtproto-support
